<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>视频播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
            color: #eee;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overscroll-behavior: none;
        }

        body.idle,
        body.locked {
            cursor: none;
        }

        body.dragging::after {
            content: '';
            position: fixed;
            inset: 10px;
            border: 2px dashed rgba(90, 162, 255, .65);
            border-radius: 12px;
            z-index: 20;
            pointer-events: none;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            background: #000;
        }

        /* 视频区手势层：覆盖全屏，承接点击/滑动 */
        #stage {
            position: fixed;
            inset: 0;
            z-index: 2;
            touch-action: none;
        }

        /* 空状态（未打开文件时） */
        #empty {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            padding: 24px;
            transition: opacity .25s;
        }

        #empty.hide {
            display: none;
        }

        #empty svg {
            width: 84px;
            height: 84px;
            fill: #4a5568;
        }

        #empty .e1 {
            font-size: 16px;
            color: #c5cdd8;
        }

        #empty .e2 {
            font-size: 13px;
            color: #7b8494;
            line-height: 1.6;
        }

        #empty .e3 {
            font-size: 12px;
            color: #566;
            line-height: 1.6;
        }

        body.touch #empty .e3 {
            display: none;
        }

        /* 加载指示 */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 5;
            width: 46px;
            height: 46px;
            margin: -23px 0 0 -23px;
            border: 3px solid rgba(255, 255, 255, .18);
            border-top-color: #5aa2ff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            display: none;
            pointer-events: none;
        }

        #loading.show {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 顶栏 / 底栏 */
        #topbar,
        #controls {
            position: fixed;
            left: 0;
            right: 0;
            z-index: 6;
            opacity: 0;
            pointer-events: none;
            transition: opacity .22s;
        }

        body.ui #topbar,
        body.ui #controls {
            opacity: 1;
            pointer-events: auto;
        }

        body.locked #topbar,
        body.locked #controls,
        body.locked #hud,
        body.locked #loading {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        #topbar {
            top: 0;
            padding: calc(env(safe-area-inset-top) + 6px) 10px 8px;
            display: flex;
            align-items: center;
            gap: 2px;
            background: linear-gradient(rgba(0, 0, 0, .72), rgba(0, 0, 0, .38) 70%, transparent);
        }

        #fileName {
            flex: 1;
            min-width: 0;
            font-size: 13px;
            color: rgba(255, 255, 255, .85);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 8px;
        }

        .tb-actions {
            display: flex;
            align-items: center;
        }

        #controls {
            bottom: 0;
            padding: 4px 12px calc(env(safe-area-inset-bottom) + 6px);
            background: linear-gradient(transparent, rgba(0, 0, 0, .38) 30%, rgba(0, 0, 0, .72));
        }

        .ibtn {
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #e8e8e8;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex: none;
        }

        .ibtn:hover {
            background: rgba(255, 255, 255, .13);
        }

        .ibtn:active {
            background: rgba(255, 255, 255, .2);
        }

        .ibtn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            pointer-events: none;
        }

        .ibtn.on {
            color: #5aa2ff;
        }

        .ibtn:disabled {
            opacity: .35;
            cursor: default;
        }

        /* 进度条 */
        .pwrap {
            position: relative;
            height: 24px;
            display: flex;
            align-items: center;
            cursor: pointer;
            touch-action: none;
            margin: 0 2px;
        }

        .ptrack {
            position: relative;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, .22);
            border-radius: 2px;
            transition: height .12s;
        }

        .pwrap:hover .ptrack,
        .pwrap.scrub .ptrack {
            height: 6px;
        }

        .pbuf,
        .pplayed {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            border-radius: 2px;
            width: 0;
        }

        .pbuf {
            background: rgba(255, 255, 255, .32);
        }

        .pplayed {
            background: #5aa2ff;
        }

        .pthumb {
            position: absolute;
            top: 50%;
            left: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            transform: translate(-50%, -50%) scale(0);
            transition: transform .12s;
            pointer-events: none;
        }

        .pwrap:hover .pthumb,
        .pwrap.scrub .pthumb {
            transform: translate(-50%, -50%) scale(1);
        }

        .ptip {
            position: absolute;
            bottom: calc(100% - 4px);
            transform: translateX(-50%);
            background: rgba(10, 10, 10, .85);
            color: #fff;
            font-size: 12px;
            padding: 3px 9px;
            border-radius: 4px;
            white-space: nowrap;
            display: none;
            pointer-events: none;
            font-variant-numeric: tabular-nums;
        }

        .ptip.show {
            display: block;
        }

        .btn-row {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .spacer {
            flex: 1;
        }

        #timeLabel {
            font-size: 12.5px;
            color: #d8d8d8;
            margin: 0 8px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* 音量（桌面） */
        .volBox {
            display: flex;
            align-items: center;
        }

        .volSlider {
            width: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            transition: width .18s;
        }

        .volBox:hover .volSlider,
        .volSlider.drag {
            width: 76px;
        }

        .volSlider input {
            width: 66px;
            margin: 0 5px;
            accent-color: #5aa2ff;
            cursor: pointer;
        }

        /* 倍速 */
        .speedWrap {
            position: relative;
        }

        #speedBtn {
            font-size: 13px;
            font-weight: 600;
            min-width: 46px;
            padding: 0 8px;
        }

        #speedMenu {
            position: absolute;
            bottom: 46px;
            right: 0;
            z-index: 7;
            background: rgba(16, 18, 22, .95);
            border-radius: 10px;
            padding: 5px;
            min-width: 84px;
            display: none;
            flex-direction: column;
        }

        #speedMenu.open {
            display: flex;
        }

        #speedMenu button {
            border: 0;
            background: none;
            color: #c9ced6;
            font-size: 13px;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        #speedMenu button:hover {
            background: rgba(255, 255, 255, .12);
            color: #fff;
        }

        #speedMenu button.active {
            color: #5aa2ff;
            font-weight: 600;
        }

        /* 手势 HUD（音量/亮度竖条 + 快进文本） */
        #hud {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 7;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
        }

        #hud.show {
            display: flex;
        }

        #hud.mode-v {
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, .55);
            padding: 16px 14px;
            border-radius: 14px;
        }

        #hud.mode-h {
            background: rgba(0, 0, 0, .62);
            padding: 10px 18px;
            border-radius: 999px;
        }

        .hud-bar {
            position: relative;
            width: 6px;
            height: 110px;
            background: rgba(255, 255, 255, .22);
            border-radius: 3px;
            overflow: hidden;
        }

        #hudFill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 3px;
            height: 50%;
        }

        #hudVal {
            font-size: 14px;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        #hudText {
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        /* 视频锁解锁按钮 */
        #unlockChip {
            position: fixed;
            z-index: 9;
            top: calc(env(safe-area-inset-top) + 10px);
            right: 10px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .3);
            background: rgba(0, 0, 0, .45);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: .6;
            transition: opacity .2s;
        }

        body.locked #unlockChip {
            display: flex;
        }

        #unlockChip.off {
            display: none !important;
        }

        #unlockChip svg {
            width: 20px;
            height: 20px;
            fill: #fff;
            pointer-events: none;
        }

        /* 提示条 */
        #toast {
            position: fixed;
            z-index: 10;
            top: calc(env(safe-area-inset-top) + 16px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 16, 20, .88);
            color: #fff;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 999px;
            opacity: 0;
            transition: opacity .2s;
            pointer-events: none;
            white-space: nowrap;
            max-width: 86vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #toast.show {
            opacity: 1;
        }

        /* 触屏设备适配 */
        body.touch .volBox {
            display: none;
        }

        body.touch #pipBtn {
            display: none;
        }

        body.touch .pwrap {
            height: 30px;
        }

        body.touch .pthumb {
            width: 14px;
            height: 14px;
        }

        body.touch #timeLabel {
            font-size: 13px;
        }

        body.touch .ibtn {
            width: 46px;
            height: 46px;
        }

        @media (max-width: 560px) {
            #fileName {
                font-size: 12px;
            }

            #empty svg {
                width: 68px;
                height: 68px;
            }
        }
    </style>
</head>

<body>
    <video id="video" playsinline webkit-playsinline preload="metadata"></video>

    <div id="empty">
        <svg viewBox="0 0 24 24">
            <path
                d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z" />
        </svg>
        <div class="e1">点击打开视频文件</div>
        <div class="e2">也可以把文件拖进窗口<br>支持 MP4 / WebM / MKV / MOV 等常见格式</div>
        <div class="e3">快捷键：空格 播放 · ← → 快退进 · ↑ ↓ 音量 · F 全屏 · M 静音 · S 截图 · 0-9 跳转</div>
    </div>

    <div id="stage"></div>
    <div id="loading"></div>

    <div id="hud">
        <div class="hud-bar"><i id="hudFill"></i></div>
        <span id="hudVal">50%</span>
        <span id="hudText">+10s</span>
    </div>

    <div id="topbar">
        <button class="ibtn" id="openBtn" title="打开文件" aria-label="打开文件">
            <svg viewBox="0 0 24 24">
                <path
                    d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z" />
            </svg>
        </button>
        <span id="fileName"></span>
        <div class="tb-actions">
            <button class="ibtn" id="shotBtn" title="截图 (S)" aria-label="截图">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9z" />
                </svg>
            </button>
            <button class="ibtn" id="pipBtn" title="画中画" aria-label="画中画">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z" />
                </svg>
            </button>
            <button class="ibtn" id="lockBtn" title="锁定控制" aria-label="锁定控制">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
                </svg>
            </button>
        </div>
    </div>

    <div id="controls">
        <div class="pwrap" id="pwrap">
            <div class="ptrack">
                <div class="pbuf" id="pbuf"></div>
                <div class="pplayed" id="pplayed"></div>
                <div class="pthumb" id="pthumb"></div>
            </div>
            <div class="ptip" id="ptip">00:00</div>
        </div>
        <div class="btn-row">
            <button class="ibtn" id="playBtn" title="播放/暂停 (空格)" aria-label="播放/暂停">
                <svg id="playIcon" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z" />
                </svg>
            </button>
            <span id="timeLabel">00:00 / 00:00</span>
            <div class="volBox">
                <button class="ibtn" id="muteBtn" title="静音 (M)" aria-label="静音">
                    <svg id="volIcon" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12z" />
                    </svg>
                </button>
                <div class="volSlider" id="volSlider">
                    <input type="range" id="volRange" min="0" max="1" step="0.05" value="1" aria-label="音量">
                </div>
            </div>
            <span class="spacer"></span>
            <div class="speedWrap" id="speedWrap">
                <button class="ibtn" id="speedBtn" title="倍速" aria-label="倍速">1.0x</button>
                <div id="speedMenu"></div>
            </div>
            <button class="ibtn" id="loopBtn" title="循环" aria-label="循环">
                <svg viewBox="0 0 24 24">
                    <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
                </svg>
            </button>
            <button class="ibtn" id="fsBtn" title="全屏 (F)" aria-label="全屏">
                <svg id="fullIcon" viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
                </svg>
            </button>
        </div>
    </div>

    <button id="unlockChip" aria-label="解锁">
        <svg viewBox="0 0 24 24">
            <path
                d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z" />
        </svg>
    </button>

    <div id="toast"></div>
    <input type="file" id="fileInput" accept="video/*,.mkv,.mov,.m4v,.avi,.webm,.mp4,.3gp,.ogv,.ts" hidden>

    <script>
        'use strict';
        const $ = id => document.getElementById(id);
        const video      = $('video'),     stage    = $('stage'),    emptyEl   = $('empty'),    loadingEl  = $('loading'),
              hud        = $('hud'),       hudFill  = $('hudFill'),  hudVal    = $('hudVal'),   hudText    = $('hudText'),
              fileNameEl = $('fileName'),  toastEl  = $('toast'),
              pwrap      = $('pwrap'),     pbuf     = $('pbuf'),     pplayed   = $('pplayed'),  pthumb     = $('pthumb'), ptip = $('ptip'),
              playBtn    = $('playBtn'),   playIcon = $('playIcon'), muteBtn   = $('muteBtn'),  volIcon    = $('volIcon'),
              volSlider  = $('volSlider'), volRange = $('volRange'), timeLabel = $('timeLabel'),
              speedWrap  = $('speedWrap'), speedBtn = $('speedBtn'), speedMenu = $('speedMenu'),
              loopBtn    = $('loopBtn'),   fsBtn    = $('fsBtn'),    fullIcon  = $('fullIcon'), pipBtn     = $('pipBtn'),
              openBtn    = $('openBtn'),   shotBtn  = $('shotBtn'),  lockBtn   = $('lockBtn'),  unlockChip = $('unlockChip'),
              fileInput  = $('fileInput');

        const ICONS = {
            play  : 'M8 5v14l11-7z',
            pause : 'M6 19h4V5H6v14zm8-14v14h4V5h-4z',
            vol   : 'M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM16.5 3.67v2.09c2.89.86 5 3.54 5 6.74s-2.11 5.88-5 6.74v2.09c4-.91 7-4.49 7-8.83s-3-7.92-7-8.83z',
            mute  : 'M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.63 4.27l1.42 1.42c1.04-1.33 1.7-2.9 1.94-4.69h-2.06c-.16 1.24-.61 2.37-1.3 3.27zM4.41 3L3 4.41l5.05 5.05H7L3 13h5v7l4.34-4.34 4.25 4.25L18 18.59 4.41 3zM14 4.79v4.76l2.45-2.45L14 4.79z',
            fs    : 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z',
            fsx   : 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z',
            lock  : 'M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z',
            unlock: 'M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z'
        };

        const store = {
            get: k => {
                try {
                    return localStorage.getItem(k);
                }
                catch (_) {
                    return null;
                }
            },
            set: (k, v) => {
                try {
                    localStorage.setItem(k, v);
                }
                catch (_) {
                    /* do nothing. */
                }
            }
        };

        const clamp    = (v, a, b) => Math.min(b, Math.max(a, v));
        const isCoarse = matchMedia('(hover: none), (pointer: coarse)').matches;
        if (isCoarse)
            document.body.classList.add('touch');

        const RATES     = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 3];

        let loaded      = false, locked = false, uiVisible = false;
        let curURL      = null, curName = '';
        let hideTimer   = 0, toastTimer = 0, hudTimer = 0;
        let scrubbing   = false, brightness = 1;
        let lastPtrType = 'mouse';
        let g           = null;                       // 当前触控手势
        let lastTap     = { t: 0, x: 0, timer: 0 };
        let turbo       = { on: false, rate: 1 };

        function fmt(s) {
            if (!isFinite(s) || s < 0)
                s = 0;

            s        = Math.floor(s);
            const h  = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
            const mm = String(m).padStart(2, '0'), ss = String(sec).padStart(2, '0');

            return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
        }

        function toast(msg, ms = 1800) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);

            toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
        }

        /* ---------- 控制栏显隐 ---------- */
        function showUI() {
            uiVisible = true;
            document.body.classList.add('ui');
            document.body.classList.remove('idle');

            scheduleHide();
        }

        function hideUI() {
            if (video.paused || speedMenu.classList.contains('open') || scrubbing || (g && g.moved))
                return;

            uiVisible = false;
            document.body.classList.remove('ui');

            if (!isCoarse)
                document.body.classList.add('idle');
        }

        function scheduleHide() {
            clearTimeout(hideTimer);
            hideTimer = setTimeout(hideUI, 2600);
        }

        stage.addEventListener('mousemove', () => {
            if (!locked)
                showUI();
        });

        stage.addEventListener('mouseleave', () => {
            if (!video.paused && !locked)
                hideUI();
        });

        /* ---------- 打开文件 ---------- */
        function openPicker() {
            fileInput.click();
        }

        openBtn.addEventListener('click', openPicker);
        emptyEl.addEventListener('click', openPicker);

        fileInput.addEventListener('change', () => {
            if (fileInput.files[0])
                openFile(fileInput.files[0]);

            fileInput.value = '';
        });

        function openFile(file) {
            if (!file)
                return;

            const ok = file.type.startsWith('video/') ||
                /\.(mp4|webm|mkv|mov|m4v|avi|3gp|ogv|ts)$/i.test(file.name);

            if (!ok) {
                toast('似乎不是视频文件');
                return;
            }

            setLocked(false);
            const old = curURL;
            curURL    = URL.createObjectURL(file);
            curName   = file.name;
            video.src = curURL;
            loaded    = true;
            document.title         = curName;
            fileNameEl.textContent = curName;
            emptyEl.classList.add('hide');
            loadingEl.classList.add('show');
            setRate(parseFloat(store.get('hvpRate')) || 1, false);
            video.play().catch(() => { });

            showUI();

            if (isCoarse && !store.get('hvpHint')) {
                store.set('hvpHint', '1');
                toast('双击 播放/暂停 · 长按 2 倍速 · 左/右半屏上下滑调亮度/音量', 4500);
            }
        }

        /* 拖放打开 */
        ['dragover', 'dragenter'].forEach(ev =>
            window.addEventListener(ev, e => { e.preventDefault(); document.body.classList.add('dragging'); }));

        window.addEventListener('dragleave', e => {
            if (!e.relatedTarget)
                document.body.classList.remove('dragging');
        });

        window.addEventListener('drop', e => {
            e.preventDefault();
            document.body.classList.remove('dragging');
            openFile(e.dataTransfer.files[0]);
        });

        /* ---------- 播放状态 ---------- */
        function togglePlay() {
            if (loaded)
                video.paused ? video.play() : video.pause();
        }

        function updatePlayUI() {
            playIcon.querySelector('path').setAttribute('d', video.paused ? ICONS.play : ICONS.pause);
        }

        playBtn.addEventListener('click', togglePlay);

        video.addEventListener('play',  () => { updatePlayUI(); showUI(); wlReq(); syncMsState(); });
        video.addEventListener('pause', () => { updatePlayUI(); showUI(); clearTimeout(hideTimer); wlRel(); syncMsState(); });
        video.addEventListener('ended', () => { showUI(); clearTimeout(hideTimer); wlRel(); });

        video.addEventListener('timeupdate',     updateProgress);
        video.addEventListener('progress',       updateProgress);
        video.addEventListener('loadedmetadata', updateProgress);
        video.addEventListener('durationchange', updateProgress);
        video.addEventListener('seeked',         updateProgress);
        video.addEventListener('waiting', () => loadingEl.classList.add('show'));
        video.addEventListener('playing', () => loadingEl.classList.remove('show'));
        video.addEventListener('canplay', () => loadingEl.classList.remove('show'));
        video.addEventListener('error',   () => {
            loadingEl.classList.remove('show');
            if (loaded && video.error)
                toast('无法播放：格式或编码不受支持', 5000);
        });

        function updateProgress() {
            const dur = video.duration || 0, cur = video.currentTime || 0;
            const pct = dur ? cur / dur * 100 : 0;
            pplayed.style.width = pct + '%';
            pthumb.style.left   = pct + '%';

            if (video.buffered.length && dur) {
                pbuf.style.width = video.buffered.end(video.buffered.length - 1) / dur * 100 + '%';
            }

            timeLabel.textContent = `${fmt(cur)} / ${fmt(dur)}`;
        }

        /* ---------- 进度条（鼠标 + 触摸统一 pointer 事件） ---------- */
        function seekToX(clientX) {
            if (!video.duration)
                return;

            const r   = pwrap.getBoundingClientRect();
            const pct = clamp((clientX - r.left) / r.width, 0, 1);
            video.currentTime = pct * video.duration;
            updateProgress();
        }

        pwrap.addEventListener('pointerdown', e => {
            if (!loaded || locked)
                return;

            e.preventDefault();
            pwrap.setPointerCapture(e.pointerId);
            scrubbing = true;
            pwrap.classList.add('scrub');
            seekToX(e.clientX);
        });

        pwrap.addEventListener('pointermove', e => {
            if (scrubbing) {
                seekToX(e.clientX);
                return;
            }

            if (e.pointerType !== 'mouse' || !loaded || !video.duration)
                return;

            const r   = pwrap.getBoundingClientRect();
            const pct = clamp((e.clientX - r.left) / r.width, 0, 1);
            ptip.textContent = fmt(pct * video.duration);
            ptip.style.left  = clamp(pct * 100, 4, 96) + '%';
            ptip.classList.add('show');
        });

        pwrap.addEventListener('pointerup', () => {
            scrubbing = false;
            pwrap.classList.remove('scrub');

            scheduleHide();
        });

        pwrap.addEventListener('pointercancel', () => {
            scrubbing = false;
            pwrap.classList.remove('scrub');
        });

        pwrap.addEventListener('pointerleave', () => {
            if (!scrubbing)
                ptip.classList.remove('show');
        });

        /* ---------- 音量 ---------- */
        let lastVol = parseFloat(store.get('hvpVol'));

        if (isFinite(lastVol))
            video.volume = clamp(lastVol, 0, 1);

        if (store.get('hvpMuted') === '1')
            video.muted = true;

        volRange.addEventListener('input', () => {
            video.muted  = volRange.value === '0';
            video.volume = +volRange.value;
        });

        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;

            if (!video.muted && video.volume === 0)
                video.volume = lastVol > 0 ? lastVol : 0.5;
        });

        video.addEventListener('volumechange', () => {
            volIcon.querySelector('path').setAttribute('d', (video.muted || video.volume === 0) ? ICONS.mute : ICONS.vol);
            volRange.value = video.muted ? 0 : video.volume;

            if (!video.muted && video.volume > 0) {
                lastVol = video.volume;
                store.set('hvpVol', String(video.volume));
            }

            store.set('hvpMuted', video.muted ? '1' : '0');
        });

        /* ---------- 倍速 ---------- */
        function rateLabel(r) {
            return (r === 1 ? '1.0' : +r.toFixed(2)) + 'x';
        }

        function setRate(r, save = true) {
            video.playbackRate = r;
            speedBtn.textContent = rateLabel(r);
            speedMenu.querySelectorAll('button').forEach(b => b.classList.toggle('active', +b.dataset.r === r));

            if (save)
                store.set('hvpRate', String(r));
        }

        RATES.forEach(r => {
            const b = document.createElement('button');
            b.textContent = r.toFixed(2).replace(/0+$/, '').replace(/\.$/, '') + 'x';
            b.dataset.r   = r;

            if (r === 1)
                b.classList.add('active');

            b.addEventListener('click', () => {
                setRate(r);
                toast('倍速 ' + rateLabel(r));
            });

            speedMenu.appendChild(b);
        });

        speedBtn.addEventListener('click', e => {
            e.stopPropagation();
            speedMenu.classList.toggle('open');
        });

        document.addEventListener('pointerdown', e => {
            if (!speedWrap.contains(e.target))
                speedMenu.classList.remove('open');
        });

        /* ---------- 循环 ---------- */
        loopBtn.addEventListener('click', () => {
            video.loop = !video.loop;
            loopBtn.classList.toggle('on', video.loop);
            toast(video.loop ? '已开启循环' : '已关闭循环');
        });

        /* ---------- 全屏 ---------- */
        function isFs() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement);
        }

        function toggleFS() {
            if (isFs()) {
                (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                return;
            }

            const el = document.documentElement;

            if (el.requestFullscreen) {
                el.requestFullscreen();
            }
            else if (el.webkitRequestFullscreen) {
                el.webkitRequestFullscreen();
            }
            else if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen(); // iPhone Safari 仅支持视频全屏
            }
        }

        fsBtn.addEventListener('click', toggleFS);
        ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
            document.addEventListener(ev, () =>
                fullIcon.querySelector('path').setAttribute('d', isFs() ? ICONS.fsx : ICONS.fs))
            );

        /* ---------- 画中画 ---------- */
        pipBtn.addEventListener('click', async () => {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                }
                else {
                    await video.requestPictureInPicture();
                }
            } catch (_) {
                toast('当前环境不支持画中画');
            }
        });

        /* ---------- 截图 ---------- */
        shotBtn.addEventListener('click', () => {
            if (!loaded || !video.videoWidth) return;
            const c = document.createElement('canvas');
            c.width = video.videoWidth; c.height = video.videoHeight;
            c.getContext('2d').drawImage(video, 0, 0);
            c.toBlob(b => {
                if (!b) {
                    toast('截图失败');
                    return;
                }

                const a    = document.createElement('a');
                a.href     = URL.createObjectURL(b);
                a.download = `${curName.replace(/[\\/:*?"<>|]/g, '_')}_${fmt(video.currentTime).replace(/:/g, '-')}.png`;
                a.click();

                setTimeout(() => URL.revokeObjectURL(a.href), 2000);
                toast('已保存截图');
            });
        });

        /* ---------- 视频锁 ---------- */
        lockBtn.addEventListener('click', () => {
            if (!loaded)
                return;

            setLocked(true);
            toast('已锁定，点击画面显示/隐藏解锁按钮');
        });

        unlockChip.addEventListener('click', () => {
            setLocked(false);
            toast('已解锁');
        });

        function setLocked(v) {
            locked = v;
            document.body.classList.toggle('locked', v);
            unlockChip.classList.remove('off');

            if (v) {
                hideUI(); clearTimeout(hideTimer);
            }
            else {
                showUI();
            }
        }

        /* ---------- 手势（触摸） ---------- */
        function showHud(mode) {
            hud.classList.add('show');
            hud.classList.toggle('mode-v', mode === 'v');
            hud.classList.toggle('mode-h', mode === 'h');
        }

        function hideHud() {
            hud.classList.remove('show');
            clearTimeout(hudTimer);
        }

        function flashHud(mode, ms = 700) {
            showHud(mode);
            clearTimeout(hudTimer);
            hudTimer = setTimeout(hideHud, ms);
        }

        function setHudV(f) {
            hudFill.style.height = (f * 100) + '%';
        }

        function startTurbo() {
            if (video.paused || !loaded)
                return;

            turbo.on   = true;
            turbo.rate = video.playbackRate;
            video.playbackRate  = Math.max(video.playbackRate, 2);
            hudText.textContent = '2x 快进中';
            showHud('h');
        }

        function stopTurbo() {
            turbo.on = false;
            video.playbackRate = turbo.rate;
            hideHud();
        }

        function skip(d) {
            if (!loaded || !video.duration)
                return;

            video.currentTime   = clamp(video.currentTime + d, 0, video.duration);
            hudText.textContent = `${d > 0 ? '快进' : '快退'} ${Math.abs(d)}s · ${fmt(video.currentTime)}`;

            flashHud('h');
        }

        stage.addEventListener('pointerdown', e => {
            lastPtrType = e.pointerType;
            e.preventDefault();
            try {
                stage.setPointerCapture(e.pointerId);
            }
            catch (_) {
                /* do nothing. */
            }

            if (g)
                return; // 忽略第二根手指

            if (!loaded) {
                g = {
                    pid   : e.pointerId,
                    sx    : e.clientX,
                    sy    : e.clientY,
                    open  : true,
                    st    : performance.now(),
                    moved : false
                };

                return;
            }

            if (locked) {
                g = {
                    pid       : e.pointerId,
                    sx        : e.clientX,
                    sy        : e.clientY,
                    lockedTap : true,
                    st        : performance.now(),
                    moved     : false
                };

                return;
            }

            g = {
                pid: e.pointerId, sx: e.clientX, sy: e.clientY,
                st : performance.now(), moved: false, axis: null,
                lp : setTimeout(() => { if (g && !g.moved) startTurbo(); }, 650)
            };
        });

        stage.addEventListener('pointermove', e => {
            if (!g || e.pointerId !== g.pid)
                return;

            const dx = e.clientX - g.sx, dy = e.clientY - g.sy;

            if (!g.moved) {
                if (Math.hypot(dx, dy) < 12)
                    return;

                g.moved = true;
                clearTimeout(g.lp);

                if (g.open || g.lockedTap)
                    return;

                if (Math.abs(dx) > Math.abs(dy) * 1.1) {
                    g.axis = 'seek';
                }
                else {
                    g.axis = (g.sx < innerWidth / 2) ? 'bri' : 'vol';
                }

                if (g.axis === 'seek') {
                    if (!video.duration) {
                        g.axis = null;
                        return;
                    }

                    g.baseTime = video.currentTime;
                    showHud('h');
                }
                else if (g.axis === 'vol') {
                    g.base = video.muted ? 0 : video.volume;
                    showHud('v');
                } else {
                    g.base = brightness;
                    showHud('v');
                }

                hideUI();
            }

            if (g.open || !g.axis)
                return;

            if (g.axis === 'seek') {
                const span   = Math.min(video.duration, 240);
                const target = clamp(g.baseTime + dx / innerWidth * span, 0, video.duration);
                g.target     = target;
                hudText.textContent = `${target >= g.baseTime ? '快进' : '快退'} ${Math.abs(Math.round(target - g.baseTime))}s · ${fmt(target)}`;
                video.currentTime   = target;
            }
            else if (g.axis === 'vol') {
                const v      = clamp(g.base - dy / innerHeight * 1.6, 0, 1);
                video.muted  = v === 0;
                video.volume = v;
                setHudV(v);
                hudVal.textContent = Math.round(v * 100) + '%';
            }
            else {
                brightness = clamp(g.base - dy / innerHeight * 1.6, 0.2, 2);
                video.style.filter = `brightness(${brightness})`;
                setHudV((brightness - 0.2) / 1.8);
                hudVal.textContent = Math.round(brightness * 100) + '%';
            }
        });

        function endGesture(e) {
            if (!g || e.pointerId !== g.pid)
                return;

            clearTimeout(g.lp);
            const gg = g; g = null;

            if (turbo.on)
                stopTurbo();

            if (gg.open) {
                if (performance.now() - gg.st < 500)
                    openPicker();

                return;
            }

            if (gg.lockedTap) {
                if (!gg.moved && performance.now() - gg.st < 450)
                    unlockChip.classList.toggle('off');

                return;
            }

            const dt = performance.now() - gg.st;

            if (!gg.moved && dt < 450)
                handleTap(e);
        }

        stage.addEventListener('pointerup',     endGesture);
        stage.addEventListener('pointercancel', endGesture);

        function handleTap(e) {
            const now = performance.now();
            if ((now - lastTap.t < 320) && Math.abs(e.clientX - lastTap.x) < 70) {
                clearTimeout(lastTap.timer);
                lastTap.t = 0;
                togglePlay();                                    // 双击 = 播放/暂停
            }
            else {
                lastTap = {
                    t     : now,
                    x     : e.clientX,
                    timer : setTimeout(() => {
                        uiVisible ? hideUI() : showUI();        // 单击 = 显隐 OSD
                    }, 300)
                };
            }
        }

        /* ---------- 键盘快捷键 ---------- */
        window.addEventListener('keydown', e => {
            if (locked)
                return;

            const t = e.target;

            if (t.tagName === 'INPUT' && t.type !== 'range')
                return;

            switch (e.code) {
                case 'Space':
                case 'KeyK':
                    e.preventDefault();
                    togglePlay();
                    break;

                case 'ArrowLeft':
                    skip(-5);
                    break;

                case 'ArrowRight':
                    skip(5);
                    break;

                case 'KeyJ':
                    skip(-10);
                    break;

                case 'KeyL':
                    skip(10);
                    break;

                case 'ArrowUp':
                case 'ArrowDown': {
                    e.preventDefault();
                    video.muted  = false;
                    video.volume = clamp(video.volume + (e.code === 'ArrowUp' ? 0.05 : -0.05), 0, 1);
                    setHudV(video.volume);
                    hudVal.textContent = Math.round(video.volume * 100) + '%';
                    flashHud('v');
                    break;
                }

                case 'KeyM':
                    muteBtn.click();
                    break;

                case 'KeyF':
                    toggleFS();
                    break;

                case 'KeyS':
                    shotBtn.click();
                    break;

                case 'Comma':
                case 'Period':
                    if (loaded && video.paused) {
                        video.currentTime = clamp(video.currentTime + (e.code === 'Period' ? 1 : -1) / 30, 0, video.duration || 0);
                    }
                    break;

                default:
                    if (/^Digit\d$/.test(e.code) && loaded && video.duration) {
                        video.currentTime = (+e.code.slice(5) / 10) * video.duration;
                        updateProgress();
                    }
            }
        });

        /* ---------- 保持屏幕常亮（播放时） ---------- */
        let wl = null;
        async function wlReq() {
            if (!('wakeLock' in navigator))
                return;

            try {
                wl = await navigator.wakeLock.request('screen');
            }
            catch (_) {
                /* do nothing. */
            }
        }

        function wlRel() {
            try {
                wl && wl.release();
            }
            catch (_) {
                /* do nothing. */
            }
            
            wl = null;
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !video.paused && loaded)
                wlReq();
        });

        /* ---------- 系统媒体控制（锁屏/通知栏） ---------- */
        function syncMsState() {
            if ('mediaSession' in navigator)
                navigator.mediaSession.playbackState = video.paused ? 'paused' : 'playing';
        }

        if ('mediaSession' in navigator) {
            video.addEventListener('loadedmetadata', () => {
                try {
                    navigator.mediaSession.metadata = new MediaMetadata({ title: curName || '视频播放器' });
                }
                catch (_) {
                    /* do nothing. */
                }
            });

            const hs = {
                play: () => video.play(),
                pause: () => video.pause(),
                seekbackward: () => skip(-10),
                seekforward: () => skip(10)
            };

            for (const k in hs) {
                try {
                    navigator.mediaSession.setActionHandler(k, hs[k]);
                }
                catch (_) {
                    /* do nothing. */
                }
            }
        }

        /* ---------- 初始化 ---------- */
        updatePlayUI();
        video.volume = video.volume; // 触发一次 UI 同步
        video.dispatchEvent(new Event('volumechange'));
    </script>
</body>

</html>
