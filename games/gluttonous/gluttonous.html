<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>贪吃蛇 · Gluttonous Snake</title>
    <style>
        :root {
            --bg: #0b0e1a;
            --panel: rgba(255, 255, 255, .04);
            --line: rgba(255, 255, 255, .10);
            --text: #e6ebf5;
            --muted: #8b93a7;
            --cyan: #22d3ee;
            --green: #4ade80;
            --rose: #fb7185;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(1000px 600px at 15% -10%, rgba(34, 211, 238, .12), transparent 60%),
                radial-gradient(900px 600px at 95% 110%, rgba(74, 222, 128, .12), transparent 60%),
                var(--bg);
            color: var(--text);
            font: 15px/1.5 "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            width: 100%;
            max-width: 480px;
        }

        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: .06em;
        }

        h1 span {
            color: var(--cyan);
        }

        .stats {
            display: flex;
            gap: 10px;
        }

        .stat {
            min-width: 76px;
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--panel);
            text-align: right;
        }

        .stat .label {
            display: block;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: .1em;
        }

        .stat .value {
            display: block;
            font-size: 20px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .board {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--line);
            background: #0a0d18;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .02);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            touch-action: none;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            padding: 24px;
            background: rgba(8, 10, 20, .72);
            backdrop-filter: blur(3px);
            transition: opacity .18s ease;
        }

        .overlay[hidden] {
            display: none;
        }

        .overlay h2 {
            margin: 0;
            font-size: 26px;
            letter-spacing: .05em;
        }

        .overlay p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        .overlay .big {
            font-size: 34px;
            font-weight: 700;
            color: var(--cyan);
            font-variant-numeric: tabular-nums;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        button {
            flex: 1 1 auto;
            padding: 10px 14px;
            font: inherit;
            font-size: 14px;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            cursor: pointer;
            transition: background .15s ease, border-color .15s ease, transform .08s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, .09);
            border-color: rgba(255, 255, 255, .22);
        }

        button:active {
            transform: translateY(1px);
        }

        button.primary {
            flex: 1 1 100%;
            font-weight: 600;
            color: #06282e;
            background: linear-gradient(135deg, var(--cyan), var(--green));
            border-color: transparent;
        }

        .hint {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 12.5px;
            text-align: center;
        }

        .hint kbd {
            padding: 1px 6px;
            border: 1px solid var(--line);
            border-bottom-width: 2px;
            border-radius: 6px;
            background: var(--panel);
            font: inherit;
            font-size: 11.5px;
        }
    </style>
</head>

<body>
    <div class="app">
        <header>
            <h1>贪吃<span>蛇</span></h1>
            <div class="stats">
                <div class="stat"><span class="label">得分</span><span class="value" id="score">0</span></div>
                <div class="stat"><span class="label">最高</span><span class="value" id="best">0</span></div>
            </div>
        </header>

        <div class="board">
            <canvas id="game"></canvas>
            <div class="overlay" id="overlay">
                <h2 id="ovTitle">准备好了吗？</h2>
                <p id="ovText">用方向键或 WASD 控制方向，吃掉光点，别撞上自己的身体。</p>
                <p class="big" id="ovScore" hidden>0</p>
            </div>
        </div>

        <div class="controls">
            <button class="primary" id="startBtn">开始游戏</button>
            <button id="pauseBtn">暂停</button>
            <button id="modeBtn">穿墙：关</button>
            <button id="soundBtn">音效：开</button>
        </div>

        <p class="hint">
            <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 ·
            <kbd>空格</kbd> 暂停 · 手机上滑动屏幕控制方向
        </p>
    </div>

    <script>
        (() => {
            'use strict';

            const SIZE     = 480;
            const GRID     = 20;
            const CELL     = SIZE / GRID;
            const BEST_KEY = 'gluttonous.best';

            const canvas   = document.getElementById('game');
            const ctx      = canvas.getContext('2d');
            const overlay  = document.getElementById('overlay');
            const ovTitle  = document.getElementById('ovTitle');
            const ovText   = document.getElementById('ovText');
            const ovScore  = document.getElementById('ovScore');
            const scoreEl  = document.getElementById('score');
            const bestEl   = document.getElementById('best');
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const modeBtn  = document.getElementById('modeBtn');
            const soundBtn = document.getElementById('soundBtn');

            const DIRS = {
                up   : { x: 0,  y: -1 },
                down : { x: 0,  y: 1  },
                left : { x: -1, y: 0  },
                right: { x: 1,  y: 0  }
            };

            let snake, dir, queue, food, score, best, state;
            let wrap = false, sound = true;
            let stepTime, acc = 0, lastTs = 0, particles = [], shake = 0;
            let audioCtx = null, bestAtStart = 0;

            best = Number(localStorage.getItem(BEST_KEY) || 0) || 0;
            bestEl.textContent = best;

            function resize() {
                const dpr     = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width  = Math.round(SIZE * dpr);
                canvas.height = Math.round(SIZE * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            window.addEventListener('resize', resize);
            resize();

            function beep(freq, dur, type) {
                if (!sound)
                    return;

                try {
                    audioCtx            = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                    const osc           = audioCtx.createOscillator();
                    const gain          = audioCtx.createGain();
                    osc.type            = type || 'square';
                    osc.frequency.value = freq;

                    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                    osc.connect(gain).connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + dur);
                } catch (e) {
                    /* 音频不可用时静默降级 */
                }
            }

            function reset() {
                const midY = Math.floor(GRID / 2);
                snake = [
                    { x: 8, y: midY },
                    { x: 7, y: midY },
                    { x: 6, y: midY },
                    { x: 5, y: midY }
                ];

                dir         = DIRS.right;
                queue       = [];
                score       = 0;
                bestAtStart = best;
                stepTime    = 165;
                acc         = 0;
                particles   = [];
                shake       = 0;
                scoreEl.textContent = 0;
                placeFood();

                state = 'ready';
            }

            function placeFood() {
                const free = [];

                for (let y = 0; y < GRID; y++) {
                    for (let x = 0; x < GRID; x++) {
                        if (!snake.some(s => (s.x === x) && (s.y === y)))
                            free.push({ x, y });
                    }
                }

                food = free.length ? free[(Math.random() * free.length) | 0] : null;
            }

            function setDir(next) {
                if (state === 'over')
                    return;

                const last = queue.length ? queue[queue.length - 1] : dir;

                if ((last.x === -next.x) && (last.y === -next.y))
                    return; // 禁止 180° 掉头

                if ((last.x === next.x) && (last.y === next.y))
                    return;

                if (queue.length < 3)
                    queue.push(next);
            }

            function step() {
                if (queue.length)
                    dir = queue.shift();

                const head = {
                    x: snake[0].x + dir.x,
                    y: snake[0].y + dir.y
                };

                if (wrap) {
                    head.x = (head.x + GRID) % GRID;
                    head.y = (head.y + GRID) % GRID;
                } else if ((head.x < 0) || (head.y < 0) || (head.x >= GRID) || (head.y >= GRID)) {
                    return die();
                }

                const ate  = food && head.x === food.x && head.y === food.y;
                const body = ate ? snake : snake.slice(0, -1);

                if (body.some(s => s.x === head.x && s.y === head.y))
                    return die();

                snake.unshift(head);
                if (!ate)
                    snake.pop();

                if (ate) {
                    score += 10;
                    scoreEl.textContent = score;

                    if (score > best) {
                        best = score;
                        bestEl.textContent = best;
                        localStorage.setItem(BEST_KEY, String(best));
                    }

                    stepTime = Math.max(70, 165 - Math.floor(score / 50) * 8);
                    burst(food.x, food.y);
                    beep(660 + Math.min(score, 400) * 2, 0.09, 'triangle');
                    food = null;
                    placeFood();
                }
            }

            function die() {
                state = 'over';
                shake = 14;

                beep(150, 0.35, 'sawtooth');
                for (let i = 0; i < 26; i++)
                    burst(snake[0].x, snake[0].y, '#fb7185');

                showOverlay('游戏结束', score > bestAtStart ? '新纪录！' : '再来一局，挑战更高分', true);
                startBtn.textContent = '再来一局';
            }

            function burst(cx, cy, color) {
                for (let i = 0; i < 14; i++) {
                    const a = Math.random() * Math.PI * 2;
                    const sp = 0.6 + Math.random() * 2.4;

                    particles.push({
                        x     : (cx + .5) * CELL,
                        y     : (cy + .5) * CELL,
                        vx    : Math.cos(a) * sp,
                        vy    : Math.sin(a) * sp,
                        life  : 1,
                        color : color || '#4ade80'
                    });
                }
            }

            function showOverlay(title, text, showScore) {
                ovTitle.textContent = title;
                ovText.textContent  = text;
                ovScore.hidden      = !showScore;

                if (showScore)
                    ovScore.textContent = score;

                overlay.hidden = false;
            }

            function start() {
                reset();

                state                = 'playing';
                overlay.hidden       = true;
                startBtn.textContent = '重新开始';
                pauseBtn.textContent = '暂停';
                acc                  = 0;
                lastTs               = performance.now();
            }

            function togglePause() {
                if (state === 'playing') {
                    state = 'paused';
                    pauseBtn.textContent = '继续';
                    showOverlay('已暂停', '按空格或点击下方按钮继续');
                } else if (state === 'paused') {
                    state                = 'playing';
                    pauseBtn.textContent = '暂停';
                    overlay.hidden       = true;
                    acc                  = 0;
                    lastTs               = performance.now();
                }
            }

            function roundedRect(x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + h, r);
                ctx.arcTo(x + w, y + h, x, y + h, r);
                ctx.arcTo(x, y + h, x, y, r);
                ctx.arcTo(x, y, x + w, y, r);
                ctx.closePath();
            }

            function draw() {
                const t = performance.now() / 1000;

                ctx.clearRect(0, 0, SIZE, SIZE);

                ctx.save();
                if (shake > 0) {
                    ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
                    shake *= 0.88;
                    if (shake < 0.4)
                        shake = 0;
                }

                // 背景棋盘
                for (let y = 0; y < GRID; y++) {
                    for (let x = 0; x < GRID; x++) {
                        ctx.fillStyle = (x + y) % 2 ? 'rgba(255,255,255,.022)' : 'rgba(255,255,255,.008)';
                        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
                    }
                }

                // 食物
                if (food) {
                    const cx    = (food.x + .5) * CELL;
                    const cy    = (food.y + .5) * CELL;
                    const pulse = 1 + Math.sin(t * 5) * 0.12;
                    const r     = CELL * 0.3 * pulse;
                    const glow  = ctx.createRadialGradient(cx, cy, 0, cx, cy, CELL * 1.1);

                    glow.addColorStop(0, 'rgba(251,113,133,.55)');
                    glow.addColorStop(1, 'rgba(251,113,133,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(cx, cy, CELL * 1.1, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#fb7185';
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,.65)';
                    ctx.beginPath();
                    ctx.arc(cx - r * .32, cy - r * .32, r * .34, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 蛇身
                const n = snake.length;
                for (let i = n - 1; i >= 0; i--) {
                    const s    = snake[i];
                    const pad  = 1.5 + Math.min(i, 20) * 0.06;
                    const x    = s.x * CELL + pad;
                    const y    = s.y * CELL + pad;
                    const w    = CELL - pad * 2;
                    const k    = (n === 1) ? 0 : (i / (n - 1));
                    const r    = Math.min(8, w / 2.4);
                    const grad = ctx.createLinearGradient(x, y, x + w, y + w);

                    if (i === 0) {
                        grad.addColorStop(0, '#67e8f9');
                        grad.addColorStop(1, '#4ade80');
                    } else {
                        grad.addColorStop(0, `rgba(34,211,238,${0.95 - k * 0.35})`);
                        grad.addColorStop(1, `rgba(74,222,128,${0.95 - k * 0.35})`);
                    }

                    ctx.fillStyle = grad;
                    roundedRect(x, y, w, w, r);
                    ctx.fill();

                    if (i === 0) {
                        ctx.shadowColor = 'rgba(103,232,249,.6)';
                        ctx.shadowBlur  = 14;
                        ctx.fill();
                        ctx.shadowBlur  = 0;
                    }
                }

                // 眼睛
                const head = snake[0];
                if (head) {
                    const hx    = (head.x + .5) * CELL;
                    const hy    = (head.y + .5) * CELL;
                    const ex    = (dir.y !== 0) ? 3.2 : (5.2 * dir.x);
                    const ey    = (dir.x !== 0) ? 3.2 : (5.2 * dir.y);
                    const perpX = (dir.y !== 0) ? 3.6 : 0;
                    const perpY = (dir.x !== 0) ? 3.6 : 0;

                    for (const s of [1, -1]) {
                        ctx.fillStyle = '#0b0e1a';
                        ctx.beginPath();
                        ctx.arc(hx + ex + perpX * s, hy + ey + perpY * s, 1.9, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // 粒子
                for (const p of particles) {
                    p.x    += p.vx;
                    p.y    += p.vy;
                    p.vy   += 0.04;
                    p.vx   *= 0.97;
                    p.life -= 0.022;

                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillStyle   = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2.4 * p.life + 0.6, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.globalAlpha = 1;
                particles       = particles.filter(p => p.life > 0);

                ctx.restore();
            }

            function loop(ts) {
                if (!lastTs)
                    lastTs = ts;

                let dt = ts - lastTs;
                lastTs = ts;

                if (dt > 200)
                    dt = 200;

                if (state === 'playing') {
                    acc += dt;
                    while (acc >= stepTime) {
                        acc -= stepTime;
                        if (state !== 'playing')
                            break;

                        step();
                    }
                }

                draw();
                requestAnimationFrame(loop);
            }

            const KEY_MAP = {
                ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
                w: 'up',       s: 'down',         a: 'left',         d: 'right',
                W: 'up',       S: 'down',         A: 'left',         D: 'right'
            };

            window.addEventListener('keydown', e => {
                if (KEY_MAP[e.key]) {
                    e.preventDefault();
                    if ((state === 'ready') || (state === 'over'))
                        start();

                    setDir(DIRS[KEY_MAP[e.key]]);
                } else if ((e.code === 'Space') || (e.key === ' ')) {
                    e.preventDefault();
                    if ((state === 'ready') || (state === 'over'))
                        start();
                    else
                        togglePause();
                }
            });

            // 触屏滑动
            let touchStart = null;
            canvas.addEventListener('touchstart', e => {
                const t    = e.changedTouches[0];
                touchStart = { x: t.clientX, y: t.clientY };
            }, { passive: true });

            canvas.addEventListener('touchend', e => {
                if (!touchStart)
                    return;

                const t    = e.changedTouches[0];
                const dx   = t.clientX - touchStart.x;
                const dy   = t.clientY - touchStart.y;
                touchStart = null;

                if ((Math.abs(dx) < 18) && (Math.abs(dy) < 18)) {
                    if ((state === 'ready') || (state === 'over'))
                        start();

                    return;
                }

                if ((state === 'ready') || (state === 'over'))
                    start();

                setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIRS.right : DIRS.left) : (dy > 0 ? DIRS.down : DIRS.up));
            }, { passive: true });

            startBtn.addEventListener('click', start);

            pauseBtn.addEventListener('click', () => {
                if ((state === 'ready') || (state === 'over'))
                    start();
                else
                    togglePause();
            });

            modeBtn.addEventListener('click', () => {
                wrap = !wrap;
                modeBtn.textContent = '穿墙：' + (wrap ? '开' : '关');
                if (state === 'playing')
                    beep(440, 0.06, 'sine');
            });

            soundBtn.addEventListener('click', () => {
                sound = !sound;
                soundBtn.textContent = '音效：' + (sound ? '开' : '关');
            });

            reset();
            requestAnimationFrame(loop);
        })();
    </script>
</body>

</html>
